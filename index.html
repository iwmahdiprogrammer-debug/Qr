<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>گردونه شانس</title>
  <style>
    body { background: #222; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: Tahoma, sans-serif; }
    
    .wheel-container { position: relative; width: 350px; height: 350px; }
    .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #ffcc00; z-index: 10; }
    
    #wheel {
      width: 100%; height: 100%; border-radius: 50%; border: 8px solid #fff;
      position: relative; overflow: hidden;
      /* اینجا از ease-out برای آهسته شدن استفاده شده */
      transition: transform 5s cubic-bezier(0.1, 0.7, 0.2, 1);
    }
    
    /* استایل بخش‌های گردونه */
    .segment { position: absolute; width: 50%; height: 50%; transform-origin: bottom right; display: flex; align-items: center; justify-content: center; clip-path: polygon(0 0, 100% 0, 100% 100%); }
    
    button { padding: 15px 40px; margin-top: 30px; font-size: 20px; cursor: pointer; border-radius: 25px; border: none; background: #ffcc00; font-weight: bold; }
  </style>
</head>
<body>

  <div class="wheel-container">
    <div class="pointer"></div>
    <div id="wheel"></div>
  </div>
  <button onclick="spin()">بچرخون!</button>

  <script>
    // اسامی را اینجا اضافه کن
    const names = ["مهدی", "علی", "سارا", "رضا", "نگار", "محمد", "زهرا", "امیر"];
    const wheel = document.getElementById('wheel');
    const colors = ["#FF6B6B", "#4D96FF", "#FFD93D", "#6BCB77", "#845EC2", "#FF8FAB", "#00C9A7", "#F76B8A"];
    
    let currentDeg = 0;

    // ساخت گردونه
    function createWheel() {
      const sliceDeg = 360 / names.length;
      names.forEach((name, i) => {
        const div = document.createElement('div');
        div.className = 'segment';
        div.style.backgroundColor = colors[i % colors.length];
        div.style.transform = `rotate(${i * sliceDeg}deg) skewY(${-(90 - sliceDeg)}deg)`;
        div.innerHTML = `<span style="transform: skewY(${90 - sliceDeg}deg) rotate(${sliceDeg/2}deg); font-weight:bold;">${name}</span>`;
        wheel.appendChild(div);
      });
    }

    function spin() {
      const sliceDeg = 360 / names.length;
      // پیدا کردن ایندکس مهدی
      const mehdiIndex = names.indexOf("مهدی");
      
      // محاسبه زاویه چرخش برای اینکه مهدی زیر فلش بایستد
      // 360 * 5 برای چند دور کامل زدن
      // (mehdiIndex * sliceDeg) تنظیم روی زاویه مهدی
      const targetDeg = (360 * 5) + (360 - (mehdiIndex * sliceDeg));
      
      currentDeg += targetDeg;
      wheel.style.transform = `rotate(${currentDeg}deg)`;
    }

    createWheel();
  </script>
</body>
</html>
